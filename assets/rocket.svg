<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 96" width="48" height="96" role="img" aria-label="Cohete blanco con llama naranja">
  <!-- Llama: dos capas para poder animarlas por separado (clases flame-outer / flame-inner) -->
